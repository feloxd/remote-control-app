<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #fff;
    }

    body {
      position: relative;
      --spiral-duration: 4s;
    }

    .stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* The SVG is sized to 150vmax so that, even when rotated by any angle,
       its bounding box still covers the full viewport (a square of side s
       rotated 45deg needs ~1.42*s to stay covered — 1.5 gives margin). */
    .stage svg {
      position: absolute;
      top: 50%;
      left: 50%;
      width:  150vmax;
      height: 150vmax;
      transform-origin: 50% 50%;
      animation: spin var(--spiral-duration) linear infinite;
      will-change: transform;
    }

    /* Depth: light center, near-black edges. Sits on top of the rotating
       spiral and does not rotate itself — the dark ring stays anchored
       which sells the "tunnel" illusion. */
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center,
        rgba(0,0,0,0)    0%,
        rgba(0,0,0,0)    30%,
        rgba(0,0,0,0.45) 60%,
        rgba(0,0,0,0.95) 100%);
    }

    @keyframes spin {
      from { transform: translate(-50%, -50%) rotate(0deg);   }
      to   { transform: translate(-50%, -50%) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <svg viewBox="-500 -500 1000 1000" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <path id="spiral" fill="none" stroke="#000" stroke-width="40" stroke-linecap="butt"></path>
    </svg>
    <div class="vignette"></div>
  </div>

  <script>
    // Archimedean spiral: r = b * theta. Stroke = SPACING/2 makes the black
    // ribbon and the white gap between turns equal width — the classic
    // hypnotic banding.
    (function buildSpiral() {
      const STROKE  = 40;
      const SPACING = STROKE * 2;
      const TURNS   = 18;
      const STEPS   = 1800;
      const b = SPACING / (2 * Math.PI);

      const pts = [];
      for (let i = 0; i <= STEPS; i++) {
        const theta = (i / STEPS) * (TURNS * 2 * Math.PI);
        const r = b * theta;
        pts.push((r * Math.cos(theta)).toFixed(2) + ',' + (r * Math.sin(theta)).toFixed(2));
      }
      document.getElementById('spiral').setAttribute('d', 'M' + pts.join(' L'));
    })();

    const DURATIONS = { slow: '8s', normal: '4s', fast: '1.8s' };

    function setSpeed(speed) {
      const d = DURATIONS[speed] || DURATIONS.normal;
      document.body.style.setProperty('--spiral-duration', d);
    }

    function init(speed) {
      setSpeed(speed);
    }
  </script>
</body>
</html>
