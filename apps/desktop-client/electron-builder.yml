appId: com.remotecontrol.client
productName: Remote Control Client
electronVersion: "29.4.6"

directories:
  output: dist
  buildResources: assets

files:
  - src/**/*
  - package.json
  - "!node_modules/.cache"
  - "!node_modules/onnxruntime-node/bin/napi-v6/darwin/**"
  - "!node_modules/onnxruntime-node/bin/napi-v6/linux/**"
  - "!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**"

extraResources:
  - from: models/nudenet-320n.onnx
    to: models/nudenet-320n.onnx
  - from: ../../LICENSE
    to: licenses/LICENSE
  - from: ../../NOTICE
    to: licenses/NOTICE
  - from: ../../THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
  - from: ../../licenses/ONNXRUNTIME-LICENSE.txt
    to: licenses/ONNXRUNTIME-LICENSE.txt

# Native .node addons must live on the real filesystem (a require() inside an
# asar archive can't dlopen a binary), so we keep them unpacked into
# app.asar.unpacked/: uiohook-napi (key telemetry) and our own keyboard_hook
# addon (the WH_KEYBOARD_LL system-wide blocker).
asarUnpack:
  - "**/node_modules/uiohook-napi/**"
  - "**/node_modules/onnxruntime-node/**"
  - "**/src/native/*.node"

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: requireAdministrator

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Remote Control Client
